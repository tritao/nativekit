<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NativeKit UI Explorer - WebGL2</title>
  <style>
    :root { color-scheme: dark; font: 14px system-ui, sans-serif; }
    html, body { margin: 0; min-height: 100%; background: #101522; }
    body { display: grid; place-items: center; gap: 12px; padding: 20px; box-sizing: border-box; }
    #canvas { display: block; width: min(1200px, 100%); height: auto; outline: none; background: #070a17; }
    #status { color: #a9b5cc; min-height: 1.2em; }
  </style>
</head>
<body>
  <canvas id="canvas" width="1200" height="800" tabindex="0" aria-label="NativeKit UI Explorer"></canvas>
  <div id="status">Loading NativeKit UI Explorer…</div>
  <script>
    const canvas = document.getElementById("canvas");
    const status = document.getElementById("status");
    const query = new URLSearchParams(location.search);
    const smoke = query.has("smoke");
    const benchmark = query.has("benchmark");
    const benchmarkMode = query.get("mode") || "browser";
    const benchmarkProfile = benchmark && query.has("profile");
    const benchmarkScenarios = {full: 0, static: 1, "text-heavy": 2, editing: 3};
    const benchmarkScenarioName = query.get("scenario") || "full";
    const benchmarkScenario = benchmarkScenarios[benchmarkScenarioName];
    const visual = query.has("visual");
    const uiVisualCase = query.has("uiVisual") ? Number(query.get("uiVisual")) : null;
    const visualWidth = Math.max(1, Number(query.get("width") || 1200));
    const visualHeight = Math.max(1, Number(query.get("height") || 800));
    const visualTime = Math.max(0, Number(query.get("time") || 0));
    if (visual) {
      document.body.style.padding = "0";
      canvas.width = visualWidth;
      canvas.height = visualHeight;
      canvas.style.width = visualWidth + "px";
      canvas.style.height = visualHeight + "px";
      status.style.display = "none";
    }
    const benchmarkWarmupFrames = Math.max(0, Number(query.get("warmup") || 120));
    const benchmarkMeasuredFrames = Math.max(1, Number(query.get("frames") || 600));
    const benchmarkFrameBudgetMs = 1000 / Math.max(1, Number(query.get("fps") || 60));
    const benchmarkStartedAt = performance.now();
    const benchmarkFrameDurations = [];
    const benchmarkFrameIntervals = [];
    const benchmarkHostApiDurations = [];
    const benchmarkGuestResidualDurations = [];
    const benchmarkHostApiCategories = Object.create(null);
    let benchmarkLastFrameAt = null;
    let benchmarkHostBytes = 0;
    let benchmarkGuestBytes = 0;
    let benchmarkHostReadyAt = null;
    let benchmarkGuestFetchMs = 0;
    let benchmarkGuestCompileMs = 0;
    let benchmarkGuestInstantiateMs = 0;
    let benchmarkGuestInitMs = 0;
    let benchmarkFirstFrameAt = null;
    let hostMemory = null;
    let memoryContract = null;
    let benchmarkAllocatorBaseline = null;
    let guest = null;
    let frameCount = 0;
    let finished = false;
    let activeHostApiFrame = null;
    const haxeonCallbacks = new Map();

    function setResult(result, message) {
      if (finished)
        return;
      finished = true;
      status.textContent = message || (result === 0
        ? "NativeKit Haxeon browser smoke test passed"
        : "NativeKit Haxeon browser smoke test failed (" + result + ")");
      document.documentElement.dataset.nativekitResult = String(result);
    }

    function percentile(sorted, fraction) {
      if (!sorted.length)
        return 0;
      const index = Math.min(sorted.length - 1, Math.ceil(sorted.length * fraction) - 1);
      return sorted[index];
    }

    function summarize(samples) {
      const sorted = [...samples].sort((left, right) => left - right);
      const total = sorted.reduce((sum, value) => sum + value, 0);
      return {
        count: sorted.length,
        mean_ms: sorted.length ? total / sorted.length : 0,
        median_ms: percentile(sorted, 0.5),
        p95_ms: percentile(sorted, 0.95),
        p99_ms: percentile(sorted, 0.99),
        min_ms: sorted[0] || 0,
        max_ms: sorted[sorted.length - 1] || 0
      };
    }

    function finishBenchmark() {
      const result = guest["ShowcaseWeb.status"]();
      const allocator = readAllocatorStats();
      const droppedFrames = benchmarkFrameIntervals.reduce((total, interval) =>
        total + Math.max(0, Math.round(interval / benchmarkFrameBudgetMs) - 1), 0);
      const report = {
        version: 1,
        benchmark: "nativekit-haxeon-showcase-web",
        mode: benchmarkMode,
        scenario: benchmarkScenarioName,
        schedule: benchmarkMode === "core" ? "synchronous-fixed-time" : "requestAnimationFrame",
        frame_budget_ms: benchmarkFrameBudgetMs,
        warmup_frames: benchmarkWarmupFrames,
        measured_frames: benchmarkMeasuredFrames,
        startup: {
          host_runtime_ready_ms: benchmarkHostReadyAt - benchmarkStartedAt,
          guest_fetch_ms: benchmarkGuestFetchMs,
          guest_compile_ms: benchmarkGuestCompileMs,
          guest_instantiate_ms: benchmarkGuestInstantiateMs,
          guest_init_ms: benchmarkGuestInitMs,
          first_frame_ms: benchmarkFirstFrameAt - benchmarkStartedAt,
          benchmark_complete_ms: performance.now() - benchmarkStartedAt
        },
        frames: summarize(benchmarkFrameDurations),
        frame_intervals: summarize(benchmarkFrameIntervals),
        frames_over_budget: benchmarkFrameDurations.filter(duration =>
          duration > benchmarkFrameBudgetMs).length,
        estimated_dropped_frames: droppedFrames,
        artifacts: {host_wasm_bytes: benchmarkHostBytes, guest_wasm_bytes: benchmarkGuestBytes},
        memory: {
          shared_capacity_bytes: hostMemory.buffer.byteLength,
          host_partition_bytes: memoryContract.hostLimit - memoryContract.hostBase,
          guest_partition_bytes: memoryContract.guestLimit - memoryContract.guestBase,
          allocator: allocator && benchmarkAllocatorBaseline ? {
            measured_allocation_calls: (allocator.allocation_count - benchmarkAllocatorBaseline.allocation_count) >>> 0,
            measured_allocated_bytes: (allocator.allocated_bytes - benchmarkAllocatorBaseline.allocated_bytes) >>> 0,
            collections_during_measurement: (allocator.collection_count - benchmarkAllocatorBaseline.collection_count) >>> 0,
            largest_allocation_bytes: allocator.largest_allocation_bytes,
            heap_high_water_bytes: allocator.heap_top - allocator.heap_base,
            heap_growth_during_measurement_bytes: allocator.heap_top - benchmarkAllocatorBaseline.heap_top,
            live_gc_metadata_bytes: allocator.metadata_top - allocator.metadata_base
          } : null
        },
        canvas: {width: canvas.width, height: canvas.height, webgl2: !!canvas.getContext("webgl2")},
        environment: {
          runner: query.get("runner") || "interactive-browser",
          hardware_concurrency: navigator.hardwareConcurrency,
          user_agent: navigator.userAgent
        }
      };
      if (benchmarkProfile) {
        const categories = {};
        for (const [name, values] of Object.entries(benchmarkHostApiCategories))
          categories[name] = {
            calls: values.calls,
            total_ms: values.total_ms,
            per_frame_ms: summarize(values.frame_ms),
            max_call_ms: values.max_call_ms
          };
        report.profile = {
          measured_frames: benchmarkFrameDurations.length,
          imported_api_calls: benchmarkHostApiCategoriesTotalCalls(),
          imported_api_ms_per_frame: summarize(benchmarkHostApiDurations),
          wasm_and_host_residual_ms_per_frame: summarize(benchmarkGuestResidualDurations),
          imported_api_categories: categories
        };
      }
      document.documentElement.dataset.nativekitBenchmark = JSON.stringify(report);
      guest["ShowcaseWeb.shutdown"]();
      setResult(result, result === 0 ? "NativeKit Haxeon browser benchmark passed" :
        "NativeKit Haxeon browser benchmark failed (" + result + ")");
    }

    function readNativeError() {
      const pointer = Module["_nk_last_error"]();
      if (!pointer || !hostMemory)
        return "unknown NativeKit error";
      const heap = new Uint8Array(hostMemory.buffer);
      let end = pointer;
      while (heap[end])
        end++;
      return new TextDecoder().decode(heap.subarray(pointer, end));
    }

    function readHostString(exportName) {
      const value = Module[exportName];
      if (typeof value !== "function" || !hostMemory)
        return "";
      const pointer = value();
      if (!pointer)
        return "";
      const heap = new Uint8Array(hostMemory.buffer);
      let end = pointer;
      while (end < heap.length && heap[end])
        end++;
      return new TextDecoder().decode(heap.subarray(pointer, end));
    }

    function diagnosticPhase(stage) {
      const fixed = {
        0: "idle",
        1: "event-pump",
        2: "make-surface-current",
        3: "graphics-lab-render",
        4: "present-surface",
        91: "create-showcase",
        92: "initialize-runtime",
        101: "explorer.prepare-frame",
        102: "explorer.build-view-tree",
        103: "explorer.submit-view-tree",
        105: "explorer.paint-and-render"
      };
      if (fixed[stage])
        return fixed[stage];
      if (stage >= 111 && stage <= 119) {
        return ["", "validate-context", "advance-gestures", "advance-animations",
          "build-render-tree", "submit-native-layout", "index-resolved-layout",
          "attach-resolved-geometry", "validate-resolved-geometry", "rebuild-focus"][stage - 110];
      }
      if (stage >= 150 && stage <= 154) {
        return ["validate-render-context", "clear-custom-paints", "build-custom-paints",
          "remove-stale-paints", "render-native-frame"][stage - 150];
      }
      if (stage >= 1000)
        return "native-ui-operation";
      return "unknown";
    }

    function guestDiagnostic(stage) {
      const nativeError = readNativeError();
      const gpuError = readHostString("_nkgpu_last_error");
      return {
        code: stage,
        phase: diagnosticPhase(stage),
        message: readHostString("_nkui_showcase_diagnostic_message"),
        breadcrumbs: readHostString("_nkui_showcase_diagnostic_breadcrumbs"),
        stack: readHostString("_nkui_showcase_diagnostic_stack"),
        native_error: nativeError === "unknown NativeKit error" ? "" : nativeError,
        gpu_error: gpuError,
        frame: frameCount,
        viewport: {
          canvas_width: canvas.width,
          canvas_height: canvas.height,
          css_width: canvas.clientWidth,
          css_height: canvas.clientHeight,
          device_pixel_ratio: window.devicePixelRatio || 1
        },
        browser: navigator.userAgent
      };
    }

    function guestFailureMessage(prefix, result, stage) {
      const diagnostic = guestDiagnostic(stage);
      document.documentElement.dataset.nativekitDiagnostic = JSON.stringify(diagnostic);
      console.error(prefix, diagnostic);
      const details = [diagnostic.message, diagnostic.native_error, diagnostic.gpu_error]
        .filter((value, index, values) => value && values.indexOf(value) === index);
      let message = `${prefix} (${result}) during ${diagnostic.phase} [diagnostic ${stage}]`;
      if (details.length)
        message += `: ${details.join(" | ")}`;
      if (diagnostic.breadcrumbs)
        message += ` | ${diagnostic.breadcrumbs}`;
      if (diagnostic.stack)
        message += `\n${diagnostic.stack}`;
      return message;
    }

    function validateMemoryContract() {
      const contract = {
        version: Module["_nkui_haxeon_memory_contract_version"](),
        pageSize: Module["_nkui_haxeon_memory_contract_page_size"](),
        hostBase: Module["_nkui_haxeon_memory_contract_host_base"](),
        hostLimit: Module["_nkui_haxeon_memory_contract_host_limit"](),
        guestBase: Module["_nkui_haxeon_memory_contract_guest_base"](),
        guestLimit: Module["_nkui_haxeon_memory_contract_guest_limit"](),
        memorySize: Module["_nkui_haxeon_memory_contract_memory_size"]()
      };
      const status = Module["_nkui_haxeon_memory_contract_status"]();
      if (contract.version !== 1)
        throw new Error("unsupported memory contract version " + contract.version);
      if (status !== 0)
        throw new Error("native heap crossed the Haxeon guest boundary");
      if (contract.hostBase !== 0 || contract.hostLimit !== contract.guestBase ||
          contract.guestBase >= contract.guestLimit || contract.guestLimit !== contract.memorySize ||
          contract.pageSize !== 65536 || contract.memorySize % contract.pageSize !== 0)
        throw new Error("native memory partition is invalid");
      if (!hostMemory || hostMemory.buffer.byteLength !== contract.memorySize)
        throw new Error("shared memory size does not match the Haxeon contract");
      return contract;
    }

    function readAllocatorStats() {
      const names = ["heap_base", "heap_top", "root_base", "root_top", "root_limit", "metadata_base", "metadata_top", "allocation_count", "allocated_bytes", "largest_allocation_bytes", "collection_count"];
      if (!guest || names.some(name => typeof guest["haxeon.memory." + name] !== "function"))
        return null;
      return Object.fromEntries(names.map(name => [name, guest["haxeon.memory." + name]() >>> 0]));
    }

    function readGuestMemoryContract(module) {
      const sections = WebAssembly.Module.customSections(module, "haxeon.memory.contract");
      if (sections.length !== 1)
        throw new Error("guest did not provide exactly one memory contract");
      const bytes = new Uint8Array(sections[0]);
      if (bytes.length !== 28 || bytes[0] !== 72 || bytes[1] !== 77 || bytes[2] !== 67)
        throw new Error("guest memory contract has an invalid header");
      const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
      return {
        version: view.getUint8(3),
        pageSize: view.getUint32(4, true),
        hostBase: view.getUint32(8, true),
        hostLimit: view.getUint32(12, true),
        guestBase: view.getUint32(16, true),
        guestLimit: view.getUint32(20, true),
        memorySize: view.getUint32(24, true)
      };
    }

    function validateGuestMemoryContract(module, hostContract) {
      const guestContract = readGuestMemoryContract(module);
      for (const field of ["version", "pageSize", "hostBase", "hostLimit", "guestBase", "guestLimit", "memorySize"])
        if (guestContract[field] !== hostContract[field])
          throw new Error("guest memory contract mismatch in " + field);
    }

    function forward(names) {
      return Object.fromEntries(names.map(name => {
        const value = Module["_" + name];
        if (typeof value !== "function")
          throw new Error("Emscripten did not export " + name);
        return [name, (...args) => {
          const frame = activeHostApiFrame;
          if (!frame)
            return value(...args);
          const startedAt = performance.now();
          try {
            return value(...args);
          } finally {
            const duration = performance.now() - startedAt;
            const category = hostApiCategory(name);
            const entry = frame.categories[category] || (frame.categories[category] = {calls: 0, total_ms: 0, max_call_ms: 0});
            frame.calls++;
            frame.total_ms += duration;
            entry.calls++;
            entry.total_ms += duration;
            entry.max_call_ms = Math.max(entry.max_call_ms, duration);
          }
        }];
      }));
    }

    function hostApiCategory(name) {
      if (name === "nkui_layout_session_submit") return "layout_submission";
      if (name.startsWith("nkui_text_layout_") || name.startsWith("nkui_font_collection_")) return "text_layout_and_shaping";
      if (name.startsWith("nkui_renderer_") || name === "nkui_layout_session_render_frame") return "native_rendering";
      if (name.startsWith("nkui_display_list_")) return "display_list";
      if (name.startsWith("nk_")) return "platform_and_surface";
      return "other_native_api";
    }

    function benchmarkHostApiCategoriesTotalCalls() {
      return Object.values(benchmarkHostApiCategories).reduce((total, value) => total + value.calls, 0);
    }

    function invokeShowcaseFrame(time) {
      const frameProfile = benchmarkProfile ? {calls: 0, total_ms: 0, categories: Object.create(null)} : null;
      activeHostApiFrame = frameProfile;
      const startedAt = performance.now();
      let result;
      try {
        result = guest["ShowcaseWeb.frame"](time);
      } finally {
        activeHostApiFrame = null;
      }
      return {result, duration_ms: performance.now() - startedAt, profile: frameProfile};
    }

    function recordBenchmarkFrame(sample, animationTime) {
      benchmarkFrameDurations.push(sample.duration_ms);
      if (benchmarkProfile && sample.profile) {
        benchmarkHostApiDurations.push(sample.profile.total_ms);
        benchmarkGuestResidualDurations.push(Math.max(0, sample.duration_ms - sample.profile.total_ms));
        for (const [name, value] of Object.entries(sample.profile.categories)) {
          const total = benchmarkHostApiCategories[name] || (benchmarkHostApiCategories[name] = {
            calls: 0, total_ms: 0, max_call_ms: 0, frame_ms: []
          });
          total.calls += value.calls;
          total.total_ms += value.total_ms;
          total.max_call_ms = Math.max(total.max_call_ms, value.max_call_ms);
          total.frame_ms.push(value.total_ms);
        }
      }
      if (benchmarkMode !== "core") {
        if (benchmarkLastFrameAt !== null)
          benchmarkFrameIntervals.push(animationTime - benchmarkLastFrameAt);
        benchmarkLastFrameAt = animationTime;
      }
    }

    function runCoreBenchmark() {
      const totalFrames = benchmarkWarmupFrames + benchmarkMeasuredFrames;
      const fixedStepMs = benchmarkFrameBudgetMs;
      try {
        if (benchmarkWarmupFrames === 0)
          benchmarkAllocatorBaseline = readAllocatorStats();
        for (let index = 0; index < totalFrames; index++) {
          const sample = invokeShowcaseFrame(index * fixedStepMs);
          frameCount++;
          if (benchmarkFirstFrameAt === null)
            benchmarkFirstFrameAt = performance.now();
          if (sample.result < 0) {
            const diagnostic = guest["ShowcaseWeb.diagnostic"]();
            setResult(-sample.result, guestFailureMessage("Haxeon Showcase frame failed",
              sample.result, diagnostic));
            return;
          }
          if (index + 1 === benchmarkWarmupFrames)
            benchmarkAllocatorBaseline = readAllocatorStats();
          if (index >= benchmarkWarmupFrames)
            recordBenchmarkFrame(sample, index * fixedStepMs);
        }
        document.documentElement.dataset.nativekitFrames = String(frameCount);
        finishBenchmark();
      } catch (error) {
        const allocator = readAllocatorStats();
        setResult(21, "Haxeon core benchmark failed: " + (error.stack || error.message) +
          (allocator ? " | allocator=" + JSON.stringify(allocator) : ""));
      }
    }

    function waitForCoreBenchmarkReady(time) {
      if (finished || !guest)
        return;
      try {
        const sample = invokeShowcaseFrame(time);
        frameCount++;
        document.documentElement.dataset.nativekitFrames = String(frameCount);
        if (sample.result < 0) {
          const diagnostic = guest["ShowcaseWeb.diagnostic"]();
          setResult(-sample.result, guestFailureMessage("Haxeon Showcase frame failed",
            sample.result, diagnostic));
          return;
        }
        if (guest["ShowcaseWeb.status"]() !== 0) {
          requestAnimationFrame(waitForCoreBenchmarkReady);
          return;
        }
        benchmarkFirstFrameAt = performance.now();
        runCoreBenchmark();
      } catch (error) {
        const allocator = readAllocatorStats();
        setResult(21, "Haxeon core benchmark initialization failed: " +
          (error.stack || error.message) +
          (allocator ? " | allocator=" + JSON.stringify(allocator) : ""));
      }
    }

    function nativekitImports() {
      return forward([
        "nk_api_version", "nk_clipboard_read_text", "nk_clipboard_set_text",
        "nk_cursor_create_custom", "nk_cursor_create_standard", "nk_cursor_destroy",
        "nk_event_release", "nk_get_capabilities", "nk_init", "nk_last_error",
        "nk_poll_event", "nk_shutdown",
        "nk_surface_accessibility_clear", "nk_surface_accessibility_remove_node",
        "nk_surface_accessibility_set_focus", "nk_surface_accessibility_set_node",
        "nk_surface_accessibility_update_with_removed_ids",
        "nk_surface_create", "nk_surface_destroy", "nk_surface_get_framebuffer_size",
        "nk_surface_make_current", "nk_surface_present", "nk_surface_set_bounds",
        "nk_surface_set_text_input_active", "nk_surface_set_text_input_geometry",
        "nk_surface_set_text_input_state",
        "nk_time_seconds", "nk_window_create", "nk_window_destroy", "nk_window_get_cursor_mode",
        "nk_window_get_scale", "nk_window_set_cursor", "nk_window_set_cursor_mode",
        "nk_window_set_decoration_regions", "nk_webview_create", "nk_webview_destroy",
        "nk_webview_set_bounds", "nk_webview_set_html", "nk_webview_show",
        "nk_resource_load_async"
      ]);
    }

    function nativekitUiImports() {
      return forward([
        "nkui_display_list_create", "nkui_display_list_destroy",
        "nkui_display_list_get_info", "nkui_display_list_reset",
        "nkui_display_list_submit", "nkui_font_collection_add", "nkui_font_collection_add_data",
        "nkui_font_collection_add_system_fallbacks",
        "nkui_font_collection_create", "nkui_image_create", "nkui_image_create_filtered",
        "nkui_image_load_file",
        "nkui_layout_session_clear_custom_paints",
        "nkui_paint_create_linear_gradient", "nkui_paint_create_solid",
        "nkui_path_create", "nkui_renderer_create",
        "nkui_renderer_render", "nkui_renderer_destroy", "nkui_renderer_get_stats",
        "nkui_renderer_render_frame", "nkui_resource_destroy",
        "nkui_layout_session_set_custom_paint",
        "nkui_text_layout_align_grapheme", "nkui_text_layout_caret", "nkui_text_layout_create",
        "nkui_text_layout_create_styled", "nkui_text_layout_hit_test",
        "nkui_text_layout_get_selection_rects", "nkui_text_layout_next_grapheme",
        "nkui_text_layout_line_range_at", "nkui_text_layout_move_paragraph",
        "nkui_text_layout_move_word",
        "nkui_text_layout_measure", "nkui_text_layout_intrinsic_metrics",
        "nkui_text_layout_position_offset",
        "nkui_text_layout_previous_grapheme",
        "nkui_text_layout_set_text", "nkui_text_layout_set_color", "nkui_text_layout_update",
        "nkui_text_layout_word_range",
        "nkui_layout_session_create", "nkui_layout_session_destroy",
        "nkui_layout_session_get_resolved_items",
        "nkui_layout_session_render_frame", "nkui_layout_session_set_font_collection",
        "nkui_layout_session_set_measure_callback",
        "nkui_layout_session_submit", "nkui_showcase_cube_create",
        "nkui_showcase_cube_set_rotation", "nkui_showcase_diagnostic_report"
      ]);
    }

    function haxeonBytes(pointer) {
      if (!pointer || !hostMemory)
        return new Uint8Array(0);
      const view = new DataView(hostMemory.buffer);
      const length = view.getInt32(pointer + 8, true);
      return new Uint8Array(hostMemory.buffer, pointer + 16, Math.max(0, length));
    }

    function haxeonCallbackTokens(signature) {
      const split = signature.indexOf(">");
      const tokenize = text => {
        const result = [];
        let depth = 0, start = 0;
        for (let index = 0; index < text.length; index++) {
          if (text[index] === "{") depth++;
          else if (text[index] === "}") depth--;
          else if (text[index] === "," && depth === 0) {
            result.push(text.slice(start, index));
            start = index + 1;
          }
        }
        if (start < text.length) result.push(text.slice(start));
        return result.filter(token => token.length > 0);
      };
      const argumentText = signature.slice(0, split);
      const resultText = signature.slice(split + 1);
      return {arguments: tokenize(argumentText), result: resultText};
    }

    function haxeonCallbackCode(token) {
      if (token[0] === "{") {
        const match = /^\{(\d+);/.exec(token);
        return {signature: "i", aggregateSize: match ? Number(match[1]) : 0};
      }
      switch (token.trim()) {
        case "9": return {signature: "f"};
        case "10": return {signature: "d"};
        case "6": case "11": case "13": case "14": return {signature: "i"};
        default: return {signature: "i"};
      }
    }

    function haxeonInvokeClosure(closure, args) {
      const value = closure | 0;
      if (!value || !guest || !guest.table)
        throw new Error("Haxeon callback has no callable closure");
      const view = new DataView(hostMemory.buffer);
      if (value & 1)
        return guest.table.get(value >>> 1)(...args);
      const functionSlot = view.getInt32(value + 8, true);
      const receiver = view.getInt32(value + 12, true);
      return guest.table.get(functionSlot)(receiver, ...args);
    }

    function haxeonRuntimeImports() {
      return {
        __math_ceil: Math.ceil,
        __math_is_finite: Number.isFinite,
        __math_is_nan: Number.isNaN,
        __math_cos: Math.cos,
        __math_fmod: (left, right) => left % right,
        __math_pow: Math.pow,
        __math_round: Math.round,
        __math_sin: Math.sin,
        native_callback_create: (signaturePointer, _pointerSizes, _pointerNullable, closure) => {
          const signature = new TextDecoder().decode(haxeonBytes(signaturePointer));
          const tokens = haxeonCallbackTokens(signature);
          const argumentCodes = tokens.arguments.map(haxeonCallbackCode);
          const resultCode = haxeonCallbackCode(tokens.result);
          const wasmSignature = (resultCode.aggregateSize ? "v" : resultCode.signature) +
            (resultCode.aggregateSize ? "i" : "") + argumentCodes.map(code => code.signature).join("");
          const state = {error: "", errorKind: 0, resultCode, argumentCodes};
          const callback = (resultPointer, ...rawArguments) => {
            try {
              const guestArguments = [];
              for (let index = 0; index < argumentCodes.length; index++) {
                const code = argumentCodes[index], raw = rawArguments[index];
                if (!code.aggregateSize) {
                  guestArguments.push(raw);
                  continue;
                }
                const bytes = guest["__haxeon_callback_alloc_bytes"](code.aggregateSize);
                new Uint8Array(hostMemory.buffer, bytes + 16, code.aggregateSize)
                  .set(new Uint8Array(hostMemory.buffer, raw, code.aggregateSize));
                guestArguments.push(bytes);
              }
              const result = haxeonInvokeClosure(closure, guestArguments);
              if (resultCode.aggregateSize) {
                if (!result)
                  throw new Error("Haxeon callback returned a null aggregate");
                new Uint8Array(hostMemory.buffer, resultPointer, resultCode.aggregateSize)
                  .set(new Uint8Array(hostMemory.buffer, result + 16, resultCode.aggregateSize));
                return;
              }
              return result;
            } catch (error) {
              state.errorKind = 1;
              state.error = error && (error.stack || error.message) || String(error);
              if (resultCode.aggregateSize && resultPointer)
                new Uint8Array(hostMemory.buffer, resultPointer, resultCode.aggregateSize).fill(0);
              return resultCode.signature === "d" || resultCode.signature === "f" ? 0 : 0;
            }
          };
          const functionPointer = Module.addFunction(callback, wasmSignature);
          haxeonCallbacks.set(functionPointer, {functionPointer, state});
          return functionPointer;
        },
        native_callback_close: pointer => {
          const entry = haxeonCallbacks.get(pointer);
          if (!entry) return 0;
          haxeonCallbacks.delete(pointer);
          Module.removeFunction(entry.functionPointer);
          return 1;
        },
        native_callback_error_kind: pointer => {
          const entry = haxeonCallbacks.get(pointer);
          return entry ? entry.state.errorKind : 0;
        },
        native_callback_take_error: pointer => {
          const entry = haxeonCallbacks.get(pointer);
          if (!entry || !entry.state.errorKind)
            return 0;
          const encoded = new TextEncoder().encode(entry.state.error);
          const bytes = guest["__haxeon_callback_alloc_bytes"](encoded.length);
          new Uint8Array(hostMemory.buffer, bytes + 16, encoded.length).set(encoded);
          entry.state.error = "";
          entry.state.errorKind = 0;
          return bytes;
        }
      };
    }

    function startGuest() {
      const imports = {
        env: { memory: hostMemory },
        nativekit: nativekitImports(),
        nativekit_ui: nativekitUiImports(),
        std: {
          sys_exit: code => {},
          sys_time: () => performance.now() / 1000
        },
        haxeon_runtime: haxeonRuntimeImports()
      };
      const fetchStarted = performance.now();
      fetch("nativekit_ui_haxeon_guest.wasm")
        .then(response => response.arrayBuffer())
        .then(bytes => {
          benchmarkGuestFetchMs = performance.now() - fetchStarted;
          benchmarkGuestBytes = bytes.byteLength;
          const compileStarted = performance.now();
          return WebAssembly.compile(bytes).then(module => {
            benchmarkGuestCompileMs = performance.now() - compileStarted;
            return module;
          });
        })
        .then(module => {
          validateGuestMemoryContract(module, validateMemoryContract());
          const instantiateStarted = performance.now();
          return WebAssembly.instantiate(module, imports).then(instance => {
            benchmarkGuestInstantiateMs = performance.now() - instantiateStarted;
            return instance;
          });
        })
        .then(instance => {
          guest = instance.exports;
          let started;
          const initStarted = performance.now();
          try {
            if (benchmark && (benchmarkMode !== "browser" && benchmarkMode !== "core")) {
              setResult(27, "Unsupported benchmark mode: " + benchmarkMode);
              return;
            }
            if (benchmark && benchmarkScenario === undefined) {
              setResult(27, "Unsupported benchmark scenario: " + benchmarkScenarioName);
              return;
            }
            if (guest["ShowcaseWeb.configure"](visualWidth, visualHeight) !== 0) {
              setResult(26, "Haxeon guest rejected the initial canvas size");
              return;
            }
            if (guest["ShowcaseWeb.configureMode"](uiVisualCase !== null ? 0 : (visual ? 1 : 0)) !== 0) {
              setResult(27, "Haxeon guest rejected the initial showcase page");
              return;
            }
            if (uiVisualCase !== null &&
                guest["ShowcaseWeb.configureUiVisual"](uiVisualCase) !== 0) {
              setResult(27, "Haxeon guest rejected the UI visual case");
              return;
            }
            if (benchmark && guest["ShowcaseWeb.configureBenchmark"](benchmarkScenario) !== 0) {
              setResult(27, "Haxeon guest rejected the benchmark scenario");
              return;
            }
            started = guest["ShowcaseWeb.main"]();
          } catch (error) {
            setResult(25, "Haxeon guest main failed: " + error.message);
            return;
          }
          if (started !== 0) {
            const diagnostic = guest["ShowcaseWeb.diagnostic"]();
            setResult(started, guestFailureMessage("Haxeon Showcase failed to initialize",
              started, diagnostic));
            return;
          }
          benchmarkGuestInitMs = performance.now() - initStarted;
          if (benchmark && benchmarkWarmupFrames === 0)
            benchmarkAllocatorBaseline = readAllocatorStats();
          status.textContent = benchmark ? "Running Haxeon browser benchmark…" : smoke ? "Running Haxeon browser smoke test…" :
              "NativeKit UI Explorer · WebGL2";
          canvas.focus();
          if (benchmark && benchmarkMode === "core")
            requestAnimationFrame(waitForCoreBenchmarkReady);
          else
            requestAnimationFrame(tick);
        })
        .catch(error => setResult(24, "Haxeon guest failed: " + error.message));
    }

    function tick(time) {
      if (finished || !guest)
        return;
      try {
        const sample = invokeShowcaseFrame(visual ? (frameCount === 0 ? 0 : visualTime) : time);
        const frameResult = sample.result;
        frameCount++;
        document.documentElement.dataset.nativekitFrames = String(frameCount);
        if (benchmarkFirstFrameAt === null)
          benchmarkFirstFrameAt = performance.now();
        if (frameResult < 0) {
            const diagnostic = guest["ShowcaseWeb.diagnostic"]();
            setResult(-frameResult, guestFailureMessage("Haxeon Showcase frame failed",
              frameResult, diagnostic));
          return;
        }
        if (benchmark && frameCount === benchmarkWarmupFrames)
          benchmarkAllocatorBaseline = readAllocatorStats();
        if (benchmark && frameCount > benchmarkWarmupFrames) {
          recordBenchmarkFrame(sample, time);
          if (benchmarkFrameDurations.length >= benchmarkMeasuredFrames) {
            finishBenchmark();
            return;
          }
        }
        if (smoke && frameCount >= 60) {
          const result = guest["ShowcaseWeb.status"]();
          guest["ShowcaseWeb.shutdown"]();
          setResult(result);
          return;
        }
        requestAnimationFrame(tick);
      } catch (error) {
        const allocator = readAllocatorStats();
        setResult(21, "Haxeon Showcase frame failed: " + (error.stack || error.message) +
          (allocator ? " | allocator=" + JSON.stringify(allocator) : ""));
      }
    }

    var Module = {
      canvas,
      noInitialRun: false,
      instantiateWasm(imports, receiveInstance) {
        fetch("nativekit_ui_haxeon.wasm")
          .then(response => response.arrayBuffer())
          .then(bytes => {
            benchmarkHostBytes = bytes.byteLength;
            return WebAssembly.instantiate(bytes, imports);
          })
          .then(result => {
            hostMemory = Object.values(result.instance.exports)
              .find(value => value instanceof WebAssembly.Memory);
            benchmarkHostReadyAt = performance.now();
            receiveInstance(result.instance);
          })
          .catch(error => setResult(22, "NativeKit host failed: " + error.message));
        return {};
      },
      onRuntimeInitialized() {
        if (!hostMemory) {
          setResult(23, "NativeKit host did not expose shared memory");
          return;
        }
        try {
          memoryContract = validateMemoryContract();
        } catch (error) {
          setResult(26, "NativeKit shared memory contract failed: " + error.message);
          return;
        }
        startGuest();
      },
      print(text) { status.textContent = text; },
      printErr(text) { console.error(text); }
    };
  </script>
  <script src="nativekit_ui_haxeon.js"></script>
</body>
</html>
