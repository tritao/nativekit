name: Native release size

on:
  push:
  pull_request:

jobs:
  linux-ui-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install native UI dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libgl1-mesa-dev libgles2-mesa-dev
      - name: Configure Release UI build
        run: >-
          cmake -S . -B build-native-size -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DNK_BUILD_SHARED=ON
          -DNK_BUILD_TESTS=OFF
          -DNK_BUILD_EXAMPLES=OFF
          -DNK_BUILD_GPU=OFF
          -DNK_BUILD_UI=ON
      - name: Build native UI
        run: cmake --build build-native-size --target nativekit_ui --parallel 2
      - name: Check native UI size budget
        run: >-
          ./tools/check-native-ui-size.sh
          build-native-size/modules/ui/libnativekit_ui.so
          1700000
      - name: Package stripped libraries and debug symbols
        run: ./tools/package-native-release.sh build-native-size out/nativekit
      - name: Verify packaged UI size budget
        run: >-
          ./tools/check-native-ui-size.sh
          out/nativekit/lib/libnativekit_ui.so
          1700000
