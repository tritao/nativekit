name: UI shader sources

on:
  push:
  pull_request:

jobs:
  check-generated-shaders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: floooh/sokol-tools-bin
          ref: 11d0cf678105d614d675e6d9bd2aaf3eeff12f8c
          path: .tools/sokol-tools-bin
      - name: Verify generated UI shader sources
        env:
          SOKOL_SHDC: ${{ github.workspace }}/.tools/sokol-tools-bin/bin/linux/sokol-shdc
        run: modules/ui/tools/check-shaders.sh
