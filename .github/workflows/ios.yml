name: iOS

on:
  push:
  pull_request:

jobs:
  ios-compile:
    name: Build ${{ matrix.sdk }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sdk: [iphoneos, iphonesimulator]
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: >-
          cmake -S . -B "build-${{ matrix.sdk }}" -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_SYSROOT=${{ matrix.sdk }}
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          -DNK_BUILD_SHARED=OFF
          -DNK_BUILD_EXAMPLES=OFF
          -DNK_BUILD_TESTS=ON
          -DNK_BUILD_GPU=OFF
          -DNK_BUILD_UI=OFF
      - name: Build iOS library
        run: cmake --build "build-${{ matrix.sdk }}" --config Debug --target nativekit
      - name: Build portable test binaries
        if: matrix.sdk == 'iphonesimulator'
        run: >-
          cmake --build "build-${{ matrix.sdk }}" --config Debug
          --target nativekit_c_abi nativekit_core_tests nativekit_time_tests nativekit_platform_parity
      - name: Build iOS simulator runtime test app
        if: matrix.sdk == 'iphonesimulator'
        run: >-
          cmake --build "build-${{ matrix.sdk }}" --config Debug
          --target nativekit_ios_runtime_tests
      - name: Select and boot iOS simulator
        if: matrix.sdk == 'iphonesimulator'
        run: |
          simulator_id=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')
          if [[ -z "$simulator_id" ]]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi
          echo "IOS_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_id" 2>/dev/null || true
          xcrun simctl bootstatus "$simulator_id" -b
      - name: Run iOS simulator runtime tests
        if: matrix.sdk == 'iphonesimulator'
        run: |
          xcrun simctl install "$IOS_SIMULATOR_ID" \
            "build-iphonesimulator/tests/Debug-iphonesimulator/nativekit_ios_runtime_tests.app"
          # simctl --console can lose the app's final stdout as the process exits.
          ios_runtime_result_file="$(xcrun simctl get_app_container \
            "$IOS_SIMULATOR_ID" org.nativekit.tests.ios-runtime data)/Documents/nativekit-ios-runtime-result.txt"
          echo "iOS runtime result file: $ios_runtime_result_file"
          : > ios-runtime.log
          : > ios-simulator-diagnostics.log
          for attempt in 1 2 3; do
            echo "Running iOS simulator runtime test (attempt $attempt/3)"
            xcrun simctl terminate "$IOS_SIMULATOR_ID" \
              org.nativekit.tests.ios-runtime >/dev/null 2>&1 || true
            rm -f "$ios_runtime_result_file"
            set +e
            xcrun simctl launch --console "$IOS_SIMULATOR_ID" \
              org.nativekit.tests.ios-runtime 2>&1 | tee -a ios-runtime.log
            launch_status=${PIPESTATUS[0]}
            set -e
            echo "simctl launch status: $launch_status"
            runtime_result=""
            if [[ -f "$ios_runtime_result_file" ]]; then
              runtime_result=$(tr -d '\r\n' < "$ios_runtime_result_file")
            fi
            echo "durable iOS runtime result: ${runtime_result:-missing}"
            if [[ "$launch_status" -eq 0 ]] && [[ "$runtime_result" == "PASS" ]]; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              {
                echo "--- simulator diagnostics after attempt $attempt ---"
                xcrun simctl spawn "$IOS_SIMULATOR_ID" log show --last 3m \
                  --style compact \
                  --predicate 'process == "nativekit_ios_runtime_tests" OR eventMessage CONTAINS[c] "NATIVEKIT_IOS_RUNTIME_STAGE"' || true
              } | tee -a ios-simulator-diagnostics.log >&2
              echo "iOS simulator runtime attempt $attempt failed; retrying" >&2
              sleep 2
            fi
          done
          cat ios-runtime.log >&2
          exit 1
      - name: Upload iOS simulator diagnostics
        if: always() && matrix.sdk == 'iphonesimulator'
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-diagnostics
          path: |
            ios-runtime.log
            ios-simulator-diagnostics.log
          if-no-files-found: ignore
          retention-days: 7
