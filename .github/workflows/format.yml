name: Formatting

on:
  push:
  pull_request:

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ClangFormat
        run: >-
          python3 -m pip install --no-deps
          --target "$RUNNER_TEMP/clang-format"
          clang-format==18.1.8
      - name: Configure
        run: >-
          cmake -S . -B build
          -DNK_CLANG_FORMAT="$RUNNER_TEMP/clang-format/clang_format/data/bin/clang-format"
          -DNK_BUILD_TESTS=OFF -DNK_BUILD_EXAMPLES=OFF
      - name: Check formatting
        run: cmake --build build --target format-check
