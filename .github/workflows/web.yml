name: Web

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache web toolchain
        uses: actions/cache@v4
        with:
          path: .tools
          key: web-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/setup-emscripten.sh', 'tools/setup-web.sh') }}

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install web toolchain
        run: ./tools/setup-web.sh

      - name: Build WebGL2 showcase
        run: ./tools/build-web.sh

      - name: Run browser smoke and conformance test
        run: ./tools/test-web.sh

      - name: Run Haxeon browser smoke test
        run: ./tools/test-web-haxeon.sh
