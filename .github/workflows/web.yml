name: Web

on:
  push:
  pull_request:

jobs:
  bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAXEON_DIR: ${{ github.workspace }}/haxeon
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Check out the pinned Haxeon toolchain
        uses: actions/checkout@v7
        with:
          repository: tritao/haxeon
          ref: d51ec9c7ce2180c205d60d993a9185ee13a58d27
          path: haxeon
          submodules: recursive

      - name: Install NativeKit and Haxeon build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libffi-dev libfontconfig1-dev libgl1-mesa-dev libgles2-mesa-dev
          libgtk-3-dev libwebkit2gtk-4.1-dev ninja-build python3-fonttools xvfb

      - name: Cache Haxeon tools
        uses: actions/cache@v6
        with:
          path: haxeon/.tools
          key: haxeon-tools-${{ runner.os }}-${{ runner.arch }}-d51ec9c7-${{ hashFiles('haxeon/scripts/bootstrap-tools.sh', 'haxeon/cmake/Bootstrap.cmake') }}

      - name: Install Haxeon toolchain
        working-directory: haxeon
        run: ./scripts/bootstrap-tools.sh

      - name: Audit Haxe bindings and run native smoke tests
        run: ./tools/test-haxe-bindings.sh

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EMSDK_VERSION: 6.0.9
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Cache Emscripten SDK
        uses: actions/cache@v6
        with:
          path: .tools/emsdk
          key: emsdk-${{ runner.os }}-${{ runner.arch }}-${{ env.EMSDK_VERSION }}

      - name: Install Web toolchain
        run: ./tools/setup-web.sh

      - name: Configure NativeKit Web tests
        run: |
          source .tools/emsdk/emsdk_env.sh
          emcmake cmake -S . -B build-web -GNinja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DNK_BUILD_SHARED=OFF \
            -DNK_BUILD_EXAMPLES=OFF \
            -DNK_BUILD_TESTS=ON \
            -DNK_BUILD_GPU=OFF

      - name: Build NativeKit Web integration tests
        run: |
          source .tools/emsdk/emsdk_env.sh
          cmake --build build-web --parallel 2 --target \
            nativekit_platform_parity \
            nativekit_web_accessibility \
            nativekit_web_system_equivalents \
            nativekit_web_tasks

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Run NativeKit browser integration tests
        run: ./tools/test-web-backend.sh build-web
